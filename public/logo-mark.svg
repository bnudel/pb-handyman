<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="PB Handyman: a hammer surfing a wave">
  <defs>
    <clipPath id="pbClip">
      <circle cx="64" cy="64" r="64"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pbClip)">
    <!-- sky -->
    <rect width="128" height="128" fill="#F7EFE4"/>

    <!-- sun -->
    <circle cx="92" cy="38" r="18" fill="#F4A259"/>
    <circle cx="92" cy="38" r="18" fill="#F26D3D" opacity=".38"/>

    <!-- back swell (the wave being ridden) -->
    <path d="M0 86 C 12 80 28 70 46 74 C 64 78 72 92 90 90 C 106 88 116 72 128 64 L128 128 L0 128 Z" fill="#1E8FA8"/>

    <!-- foam lip on the curl -->
    <path d="M102 72 C 113 60 123 61 128 66 C 119 66 110 70 105 79 Z" fill="#FFFFFF" opacity=".92"/>

    <!-- ===== the rider: a hammer on a surfboard ===== -->
    <g transform="translate(46,76) rotate(-14)">
      <!-- surfboard -->
      <path d="M31 0 C 18 -8 -15 -8 -28 -2.4 C -30.8 -1.1 -30.8 1.1 -28 2.4 C -15 8 18 8 31 0 Z"
            fill="#F7EFE4" stroke="#0A2E45" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M-22 0 H 25" stroke="#F26D3D" stroke-width="3" stroke-linecap="round"/>

      <!-- hammer standing on the board -->
      <g transform="translate(1,-5) rotate(11)">
        <rect x="-3.8" y="-31" width="7.6" height="32" rx="3.8" fill="#0A2E45"/>
        <rect x="-3.8" y="-11" width="7.6" height="11" rx="3.8" fill="#F26D3D"/>
        <path d="M-15.5 -45 h 20 a 4.5 4.5 0 0 1 4.5 4.5 v 8 a 4.5 4.5 0 0 1 -4.5 4.5 h -20 c 8.5 -5.5 8.5 -11.5 0 -17 Z" fill="#0A2E45"/>
      </g>
    </g>

    <!-- spray off the tail -->
    <path d="M14 82 C 20 78 26 79 30 82" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M8 88 C 14 85 20 86 24 88" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- mid wave -->
    <path d="M0 98 C 22 91 42 101 64 105 C 90 109 108 98 128 90 L128 128 L0 128 Z" fill="#14708E"/>

    <!-- front wave -->
    <path d="M0 112 C 26 106 48 115 74 117 C 100 119 112 112 128 106 L128 128 L0 128 Z" fill="#0E5C77"/>

    <!-- foam streaks -->
    <path d="M12 107 C 24 104 34 107 44 110" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M88 104 C 100 103 108 100 118 96" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ring -->
  <circle cx="64" cy="64" r="60.5" fill="none" stroke="#0A2E45" stroke-width="7"/>
</svg>
